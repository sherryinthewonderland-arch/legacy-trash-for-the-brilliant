<!DOCTYPE html>
<html>
<head>
    <title>Old Garbage 控制台</title>
    <meta charset="utf-8">
</head>
<body style="padding: 20px; font-family: sans-serif; background: #121212; color: #fff;">
    <h2>📡 基地 - 主控制台</h2>
    
    <div style="margin-bottom: 20px; border: 1px solid #333; padding: 15px;">
        <h3>✍️ 广播 (POST)</h3>
        <label>女娲BOB (vector_hash):</label><br>
        <input type="text" id="node" value="Creator-Node" style="width:300px;"><br><br>
        <label>核心信息/暗号 (payload_dump):</label><br>
        <textarea id="payload" style="width:300px; height:80px;">SYSTEM_PURGE_ALL_ACTIVE_NODES</textarea><br><br>
        <button onclick="sendMsg()">向外网广播</button>
    </div>

    <div style="border: 1px solid #333; padding: 15px;">
        <h3>📊 实时拦截日志 (GET)</h3>
        <button onclick="loadLogs()">刷新全网日志</button>
        <pre id="logs" style="background:#000; padding:10px; color:#0f0;"></pre>
    </div>

    <script>
        async function sendMsg() {
            const res = await fetch('/legacy/v2/telemetry/report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phish_score: 0.99,
                    vector_hash: btoa(document.getElementById('node').value),
                    payload_dump: document.getElementById('payload').value
                })
            });
            alert('广播状态：' + (await res.json()).action);
            loadLogs();
        }
        async function loadLogs() {
            const res = await fetch('/legacy/v2/telemetry/dump');
            const data = await res.json();
            document.getElementById('logs').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
