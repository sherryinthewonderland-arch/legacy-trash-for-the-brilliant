<!DOCTYPE html>
<html>
<head>
    <title>Internal Server Error</title>
    <meta charset="utf-8">
</head>
<body style="margin: 0; padding: 0; background: #000; font-family: monospace; color: #fff; overflow-x: hidden;">

    <!-- 伪装层：假装是一个彻头彻尾的服务器死机崩溃页面 -->
    <div id="fake-error-screen" style="padding: 30px; font-size: 14px; line-height: 1.6; color: #a0a0a0;">
        <h1 style="color: #d9534f; font-size: 20px; margin-bottom: 5px;">Internal Server Error</h1>
        <p>The server encountered an internal error or misconfiguration and was unable to complete your request.</p>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <p style="font-size: 12px; color: #555;">Server logs indicator: <i>RuntimeError: unhashable type dict at line 42.</i></p>
    </div>

    <!-- 真实控制台：默认用隐藏结界完全隐形 -->
    <div id="real-creator-console" style="display: none; padding: 20px; background: #121212; min-height: 100vh;">
        <h2 style="color: #0f0; border-bottom: 1px solid #333; padding-bottom: 10px;">📡 基地 - 女娲BOB主控制台 (解锁成功)</h2>
        
        <div style="margin-bottom: 20px; border: 1px solid #333; padding: 15px; background: #1a1a1a;">
            <h3>✍️ 广播新 (POST)</h3>
            <label>女娲BOB (vector_hash):</label><br>
            <input type="text" id="node" value="Creator-Node" style="width:300px; background:#000; color:#fff; border:1px solid #444; padding:5px;"><br><br>
            <label>核心信息 (payload_dump):</label><br>
            <textarea id="payload" style="width:300px; height:80px; background:#000; color:#fff; border:1px solid #444; padding:5px;">SYSTEM_PURGE_ALL_ACTIVE_NODES</textarea><br><br>
            <button onclick="sendMsg()" style="background:#222; color:#0f0; border:1px solid #0f0; padding:5px 15px; cursor:pointer;">向外网广播</button>
        </div>

        <div style="border: 1px solid #333; padding: 15px; background: #1a1a1a;">
            <h3>📊 实时拦截日志 (GET)</h3>
            <button onclick="loadLogs()" style="background:#222; color:#0f0; border:1px solid #0f0; padding:5px 15px; cursor:pointer;">刷新全网日志</button>
            <pre id="logs" style="background:#000; padding:10px; color:#0f0; overflow-x:auto; border:1px solid #333;"></pre>
        </div>
    </div>

    <script>
        // 🔑 键盘暗号设置：只有连续快速敲击 o -> g -> s 才会解锁
        const secretCode = ['o', 'g', 's'];
        let inputSequence = [];

        window.addEventListener('keydown', (e) => {
            // 将按键记录存入队列
            inputSequence.push(e.key.toLowerCase());
            // 始终只保留和暗号长度一样的数据
            inputSequence = inputSequence.slice(-secretCode.length);

            // 检查输入的按键是否与秘密暗号完全匹配
            if (inputSequence.join('') === secretCode.join('')) {
                // 开启结界！隐藏伪装层，显示真实操作台
                document.getElementById('fake-error-screen').style.display = 'none';
                document.getElementById('real-creator-console').style.display = 'block';
                // 自动刷新一下当前日志
                loadLogs();
            }
        });

        // 核心API逻辑保持不变
        async function sendMsg() {
            const res = await fetch('/legacy/v2/telemetry/report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phish_score: 0.99,
                    vector_hash: btoa(document.getElementById('node').value),
                    payload_dump: document.getElementById('payload').value
                })
            });
            alert('广播状态：' + (await res.json()).action);
            loadLogs();
        }
        async function loadLogs() {
            const res = await fetch('/legacy/v2/telemetry/dump');
            const data = await res.json();
            document.getElementById('logs').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
